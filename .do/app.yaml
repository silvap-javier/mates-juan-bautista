name: mates-juan-bautista
region: nyc
features:
  - buildpack-stack=ubuntu-22

static_sites:
  - name: web
    # repo real: github.com/silvap-javier/mates-juan-bautista
    github:
      repo: silvap-javier/mates-juan-bautista
      branch: main
      deploy_on_push: true
    source_dir: /
    # No hay build: es HTML plano. Se sirve el directorio tal cual.
    output_dir: /
    index_document: index.html
    catchall_document: index.html   # cualquier ruta rara cae en la portada
